app = "snowcast"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python -m app.data.bootstrap_database"

[env]
  PORT = "8080"

[processes]
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/healthz"

[[http_service.checks]]
  interval = "60s"
  timeout = "10s"
  grace_period = "30s"
  method = "GET"
  path = "/api/readyz"
