[project]
name = "ai-sports-travel-planner"
version = "0.1.0"
description = "FastAPI backend for Snowcast ski-trip planning"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "opentelemetry-api>=1.34,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.34,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.55b0,<1.0",
  "opentelemetry-instrumentation-logging>=0.55b0,<1.0",
  "opentelemetry-instrumentation-psycopg>=0.55b0,<1.0",
  "opentelemetry-instrumentation-urllib>=0.55b0,<1.0",
  "opentelemetry-sdk>=1.34,<2.0",
  "uvicorn>=0.34,<1.0",
  "pydantic>=2.11,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
  "pre-commit>=4.2,<5.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "db_free: skip PostgreSQL setup for tests that do not access database-backed code",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
