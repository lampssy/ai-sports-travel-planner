name: Product Canary

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional Snowcast base URL override."
        required: false
        default: ""
        type: string
      latency_threshold_seconds:
        description: "Fail representative search above this duration."
        required: true
        default: "15"
        type: string

concurrency:
  group: product-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEFAULT_SNOWCAST_BASE_URL: ${{ vars.SNOWCAST_BASE_URL || 'https://snowcast.fly.dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev --no-config

      - name: Run product canary
        run: |
          base_url="${{ inputs.base_url }}"
          if [[ -z "${base_url}" ]]; then
            base_url="${DEFAULT_SNOWCAST_BASE_URL}"
          fi

          threshold="${{ inputs.latency_threshold_seconds }}"
          if [[ -z "${threshold}" ]]; then
            threshold="15"
          fi

          uv run --no-config python ops/canary/search_canary.py \
            --base-url "${base_url}" \
            --latency-threshold-seconds "${threshold}"
