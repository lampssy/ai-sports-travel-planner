name: Retain Weather Forecasts

on:
  schedule:
    - cron: "40 3 * * 0"
  workflow_dispatch:

concurrency:
  group: weather-forecast-retention
  cancel-in-progress: false

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OTEL_ENABLED: 'true'
      OTEL_SERVICE_NAME: snowcast-jobs
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_TRACES_SAMPLER_ARG: '1.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev --no-config

      - name: Apply tiered retention
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "DATABASE_URL GitHub Actions secret is required."
            exit 1
          fi
          uv run --no-config python -m app.data.retain_weather_forecasts \
            --database-url "$DATABASE_URL"
