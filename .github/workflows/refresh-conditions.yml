name: Refresh Conditions

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force refresh even when cached rows are still fresh."
        required: false
        default: false
        type: boolean
      ski_area_ids:
        description: "Optional comma-separated exact ski-area IDs. Leave both target inputs empty for all active areas."
        required: false
        default: ""
        type: string
      stay_destination_ids:
        description: "Optional comma-separated stay-destination IDs; includes every reachable ski area."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REFRESH_FORCE: ${{ inputs.force || 'false' }}
      SKI_AREA_IDS: ${{ inputs.ski_area_ids || '' }}
      STAY_DESTINATION_IDS: ${{ inputs.stay_destination_ids || '' }}
      OTEL_ENABLED: 'true'
      OTEL_SERVICE_NAME: snowcast-jobs
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_TRACES_SAMPLER_ARG: '1.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev --no-config

      - name: Validate refresh database secret
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "DATABASE_URL GitHub Actions secret is required for refresh workflow."
            exit 1
          fi

      - name: Refresh conditions
        run: |
          cmd=(uv run --no-config python -m app.data.refresh_conditions --database-url "$DATABASE_URL")

          if [[ "${REFRESH_FORCE}" == "true" ]]; then
            cmd+=(--force)
          fi

          if [[ -n "${SKI_AREA_IDS}" ]]; then
            IFS=',' read -ra raw_targets <<< "${SKI_AREA_IDS}"
            for raw_target in "${raw_targets[@]}"; do
              target="$(echo "${raw_target}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              if [[ -n "${target}" ]]; then
                cmd+=(--ski-area "${target}")
              fi
            done
          fi

          if [[ -n "${STAY_DESTINATION_IDS}" ]]; then
            IFS=',' read -ra raw_targets <<< "${STAY_DESTINATION_IDS}"
            for raw_target in "${raw_targets[@]}"; do
              target="$(echo "${raw_target}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              if [[ -n "${target}" ]]; then
                cmd+=(--stay-destination "${target}")
              fi
            done
          fi

          printf 'Running refresh command:'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}"
