name: Parse Canary

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional Snowcast base URL override."
        required: false
        default: ""
        type: string
      query:
        description: "Representative parse query."
        required: true
        default: "ski in france in may from prague"
        type: string
      timeout_seconds:
        description: "HTTP timeout for the parse canary request."
        required: true
        default: "30"
        type: string

concurrency:
  group: parse-canary
  cancel-in-progress: false

jobs:
  parse-canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEFAULT_SNOWCAST_BASE_URL: ${{ vars.SNOWCAST_BASE_URL || 'https://snowcast.fly.dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev --no-config

      - name: Run parse canary
        run: |
          base_url="${{ inputs.base_url }}"
          if [[ -z "${base_url}" ]]; then
            base_url="${DEFAULT_SNOWCAST_BASE_URL}"
          fi

          query="${{ inputs.query }}"
          if [[ -z "${query}" ]]; then
            query="ski in france in may from prague"
          fi

          timeout="${{ inputs.timeout_seconds }}"
          if [[ -z "${timeout}" ]]; then
            timeout="30"
          fi

          uv run --no-config python ops/canary/parse_canary.py \
            --base-url "${base_url}" \
            --query "${query}" \
            --timeout-seconds "${timeout}"
