search_model_version = "search-v4"
ranking_policy_version = "search-v4-policy-1"

[group_importance_multipliers]
ignore = 0
secondary = 0.5
normal = 1
important = 2
primary = 4
very_high = 8

[factor_importance_multipliers]
low = 0.5
normal = 1
high = 2

[refinement]
max_questions = 3
max_options_per_question = 4
max_factor_patches_per_option = 3
max_candidate_summaries = 10
max_clarifiable_factors = 30
max_question_characters = 280
max_option_label_characters = 80
max_option_description_characters = 240
max_llm_retries = 1
eligibility_change_is_material = true
winner_change_is_material = true
top_three_membership_change_is_material = true
top_three_order_margin_points = 2
top_five_candidate_difference_points = 5

[weather]
policy_version = "trip-window-snow-v1"
depth_curve_values = [0, 10, 20, 30, 60, 100]
depth_curve_utilities = [0, 0.15, 0.40, 0.60, 0.90, 1]
fresh_snow_curve_values = [0, 5, 15, 30]
fresh_snow_curve_utilities = [0, 0.25, 0.70, 1]
rain_curve_values = [0, 5, 15, 30]
rain_curve_utilities = [0, 0.25, 0.75, 1]
thaw_curve_values = [0, 12, 36, 72]
thaw_curve_utilities = [0, 0.20, 0.60, 1]
fresh_snow_coefficient = 0.15
rain_thaw_risk_coefficient = 0.25
lead_time_max_days = [5, 10, 16, 30]
lead_time_forecast_shares = [0.80, 0.60, 0.40, 0.15]
preferred_short_range_source = "ecmwf_ifs025_ensemble_mean"
fallback_and_long_range_source = "ncep_gefs05_ensemble_mean"
preferred_short_range_max_lead_days = 15
maximum_forecast_lead_days = 30
recent_climatology_adjustment_weight = 0.20
snowmaking_need_full_below = 0.30
snowmaking_need_zero_at = 0.75
snowmaking_uplift_coefficient = 0.25

[[correlations]]
correlation_group_id = "terrain_scale"
description = "Accessible terrain, wider potential, and lift-network scale can overlap."
mode = "informational"

[[correlations]]
correlation_group_id = "terrain_fit"
description = "Party skill fit and later terrain-fit signals may share difficulty evidence."
mode = "informational"

[[correlations]]
correlation_group_id = "pass_value"
description = "Pass price and pass-terrain value share price evidence; only one is initially selected."
mode = "informational"

[[groups]]
group_id = "trip_viability"
label = "Trip viability"
description = "Whether the requested ski dates have credible season and snow support."
default_budget = 30
max_effective_share = 1
allowed_importance_labels = ["ignore", "secondary", "normal", "important", "primary", "very_high"]
clarifiable = true
llm_description = "How strongly the traveller prioritizes viable snow for the requested window."

[[groups]]
group_id = "ski_experience"
label = "Ski experience"
description = "Terrain scale, party ability fit, and explicitly requested ski features."
default_budget = 30
max_effective_share = 1
allowed_importance_labels = ["ignore", "secondary", "normal", "important", "primary", "very_high"]
clarifiable = true
llm_description = "How strongly terrain and the on-snow experience should drive the choice."

[[groups]]
group_id = "stay_practicality"
label = "Stay practicality"
description = "Practical access from the selected stay base to the selected ski area."
default_budget = 15
max_effective_share = 1
allowed_importance_labels = ["ignore", "secondary", "normal", "important", "primary", "very_high"]
clarifiable = true
llm_description = "How strongly convenient base-to-ski access should drive the choice."

[[groups]]
group_id = "value"
label = "Value"
description = "Comparable pass price or pass-accessible terrain value selected by the user."
default_budget = 10
max_effective_share = 1
allowed_importance_labels = ["ignore", "secondary", "normal", "important", "primary", "very_high"]
clarifiable = true
llm_description = "Whether comparable lift-pass cost or terrain per pass should be optimized."

[[groups]]
group_id = "character"
label = "Character"
description = "Requested ski-day apres, local apres, pace, settlement form, and development style."
default_budget = 10
max_effective_share = 1
allowed_importance_labels = ["ignore", "secondary", "normal", "important", "primary", "very_high"]
clarifiable = true
llm_description = "Which ski-day and accommodation-base atmosphere best suits the traveller."

[[groups]]
group_id = "travel_effort"
label = "Travel effort"
description = "Relative car journey effort from a supplied origin after hard travel limits."
default_budget = 5
max_effective_share = 0.30
allowed_importance_labels = ["ignore", "secondary", "normal", "important", "primary", "very_high"]
clarifiable = true
llm_description = "How strongly journey effort should influence eligible recommendations."

